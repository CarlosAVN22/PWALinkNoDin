<!DOCTYPE html>

<html lang="es">

<head>
     <meta charset="utf-8" />
     <meta content="width=device-width,initial-scale=1" name="viewport" />
     <title>
          Registro empresa | LinkNoDin
     </title>
     <link href="/css/estilos.css" rel="stylesheet" />
     <link href="/css/linknodin.css" rel="stylesheet" />
     <link rel="stylesheet" href="/css/worklink-pendientes.css">
</head>

<body>
     <header class="topbar">
          <a class="brand" href="/doc/general/index.html">
               <img alt="" class="brand-logo" src="/img/logo.png" />
               <span class="brand-copy">
                    <span class="brand-title"><span class="brand-link">Link</span><span class="brand-no">No</span><span
                              class="brand-din">Din</span></span>
                    <span class="brand-tagline">CONECTANDO OPORTUNIDADES</span>
               </span>
          </a>
          <nav class="navlinks">
               <a class="" href="/doc/general/index.html">
                    Inicio
               </a>
               <a class="" href="/doc/empleo/empleos.html">
                    Empleos
               </a>
               <a class="" href="/doc/empresa/empresas.html">
                    Empresas
               </a>
               <a class="" href="/doc/general/recursos.html">
                    Recursos
               </a>
               <a class="" href="/doc/cursos-foros/foros.html">
                    Foros
               </a>
          </nav>
          <div class="actions">
               <a class="btn btn-sm" href="/doc/general/login.html">
                    Iniciar sesión
               </a>
               <a class="btn btn-primary btn-sm" href="/doc/general/registro.html">
                    Registrarse
               </a>
          </div>
     </header>
     <main>
          <div class="container">
               <div class="panel formbox wide">
                    <h1>
                         Registro de empresa
                    </h1>
                    <form class="demo-form" data-role="empresa" id="ld-register">
                         <div class="grid2">
                              <div class="field">
                                   <label>
                                        Nombre de empresa
                                   </label>
                                   <input placeholder="Nombre de empresa" required="" type="text" />
                              </div>
                              <div class="field">
                                   <label>
                                        Nombre del representante
                                   </label>
                                   <input placeholder="Nombre del representante" required="" type="text" />
                              </div>
                              <div class="field">
                                   <label>
                                        Correo corporativo
                                   </label>
                                   <input placeholder="Correo corporativo" required="" type="email" />
                              </div>
                              <div class="field">
                                   <label>
                                        Teléfono
                                   </label>
                                   <input placeholder="Teléfono" required="" type="text" />
                              </div>
                              <div class="field"><label for="company-sector">Sector</label><select id="company-sector" required><option value="">Selecciona un sector</option><option>Tecnología</option><option>Comercio</option><option>Servicios financieros</option><option>Salud</option><option>Educación</option><option>Industria</option><option>Otro</option></select></div>
                              <div class="field"><label for="company-city">Ciudad</label><select id="company-city" required><option value="">Selecciona una ciudad</option><option>San Salvador</option><option>Santa Ana</option><option>San Miguel</option><option>Sonsonate</option><option>Santa Tecla</option><option>La Libertad</option><option>Usulután</option><option>La Unión</option><option>Chalatenango</option></select></div>
                              <div class="field">
                                   <label>
                                        Contraseña
                                   </label>
                                   <input placeholder="Contraseña" required="" type="password" />
                              </div>
                              <div class="field">
                                   <label>
                                        Confirmar contraseña
                                   </label>
                                   <input placeholder="Confirmar contraseña" required="" type="password" />
                              </div>
                         </div>
                         <button class="btn btn-primary">
                              Registrar empresa
                         </button>
                         <p aria-live="polite" class="ld-status" id="ld-status" role="status"></p>
                    </form>
                    <p>
                         <a class="" href="/doc/general/login.html">
                              Iniciar sesión
                         </a>
                    </p>
               </div>
          </div>
     </main>
     <footer class="footer">
          LinkNoDin · Portal de empleo
     </footer>
     <script src="/js/app.js">
     </script>
     <script src="/js/acceso-demo.js"></script>
     <script src="/js/linknodin.js"></script>
     <script src="/js/notificaciones.js"></script>
     <script src="/js/worklink-pendientes.js"></script>
     <script src="/js/empresa-prototipo.js"></script>
</body>

</html>
