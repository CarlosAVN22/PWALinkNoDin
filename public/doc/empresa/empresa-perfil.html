    <meta charset="utf-8" />

    <link href="/css/estilos.css" rel="stylesheet" />

    <link rel="stylesheet" href="/css/worklink-pendientes.css">
</head>

<body>
    <header class="topbar">
        <a class="brand" href="/doc/general/index.html">
            <img alt="" class="brand-logo" src="/img/logo.png" />
            <span class="brand-copy">
                <span class="brand-title"><span class="brand-link">Link</span><span class="brand-no">No</span><span
                        class="brand-din">Din</span></span>
                <span class="brand-tagline">CONECTANDO OPORTUNIDADES</span>
            </span>
        </a>
        <nav class="navlinks">
            <a class="" href="/doc/general/index.html">
                Inicio
            </a>
            <a class="" href="/doc/empleo/empleos.html">
                Empleos
            </a>
            <a class="" href="/doc/empresa/empresas.html">
                Empresas
            </a>
            <a class="" href="/doc/general/recursos.html">
                Recursos
            </a>
            <a class="" href="/doc/cursos-foros/foros.html">
                Foros
            </a>
        </nav>
        <div class="actions">
            <a class="btn btn-sm" href="/doc/general/index.html">
                Salir al inicio
            </a>
        </div>
    </header>
    <main>
        <div class="container">
            <h1 class="page-title">
                Perfil de empresa
            </h1>
            <p class="lead">
                Mantén actualizados los datos corporativos.
            </p>
            <div class="layout">
                <aside class="sidebar">
                    <h4>
                        Menú de navegación
                    </h4>
                    <a class="" href="/doc/empresa/empresa-panel.html">
                        Panel empresa
                    </a>
                    <a class="active" href="/doc/empresa/empresa-perfil.html">
                        Perfil empresa
                    </a>
                    <a class="" href="/doc/empresa/empresa-vacantes.html">
                        Mis vacantes
                    </a>
                    <a class="" href="/doc/empleo/publicar.html">
                        Publicar empleo
                    </a>
                    <a class="" href="/doc/empresa/empresa-candidatos.html">
                        Candidatos
                    </a>
                </aside>
                <div class="content">
                    <form class="panel demo-form">
                        <h3>
                            Información empresarial
                        </h3>
                        <div class="grid2">
                            <div class="field">
                                <label>
                                    Nombre comercial
                                </label>
                                <input placeholder="Nombre comercial" required="" type="text" />
                            </div>
                            <div class="field">
                                <label>
                                    Sector
                                </label>
                                <input placeholder="Sector" required="" type="text" />
                            </div>
                            <div class="field">
                                <label>
                                    Ubicación
                                </label>
                                <input placeholder="Ubicación" required="" type="text" />
                            </div>
                            <div class="field">
                                <label>
                                    Correo de contacto
                                </label>
                                <input placeholder="Correo de contacto" required="" type="text" />
                            </div>
                            <div class="field">
                                <label>
                                    Teléfono
                                </label>
                                <input placeholder="Teléfono" required="" type="text" />
                            </div>
                            <div class="field">
                                <label>
                                    Sitio web
                                </label>
                                <input placeholder="Sitio web" required="" type="text" />
                            </div>
                        </div>
                        <div class="field">
                            <label>
                                Descripción
                            </label>
                            <textarea></textarea>
                        </div>
                        <button class="btn btn-primary" type="submit">
                            Guardar información
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        LinkNoDin · Portal de empleo
    </footer>
    <script src="/js/app.js">
    </script>
    <script src="/js/acceso-demo.js"></script>
     <script src="/js/linknodin.js"></script>
    <script src="/js/notificaciones.js"></script>
    <script src="/js/worklink-pendientes.js"></script>
</body>

</html>
